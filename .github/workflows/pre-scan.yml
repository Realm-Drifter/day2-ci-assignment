name: Pre-scan

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"

jobs:
  pre-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install scan tools
        run: pip install pip-audit bandit

      - name: Dependency audit
        run: pip-audit -r app/requirements-dev.txt

      - name: Static code scan
        run: bandit -r app -ll
