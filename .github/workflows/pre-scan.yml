name: Pre-scan

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"

jobs:
  pre-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install scan tools
        run: pip install pip-audit bandit

      - name: Dependency audit
        run: pip-audit -r app/requirements-dev.txt

      - name: Static code scan
        run: bandit -r app -ll

      - name: Secret scan (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --verbose --redact

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SECRET }}
