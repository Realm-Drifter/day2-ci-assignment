name: Day 2 CI
run-name: ${{ github.actor }} triggered this run

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      python-version:
        description: Python version to use
        type: choice
        options:
          - "3.12"
          - "3.13"
        default: "3.13"
      create-package:
        description: Create the package
        type: boolean
        default: true
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

env:
  APP_NAME: temperature

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.13' }}
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pytest

      - name: Run pytest
        run: pytest -v --junitxml=reports/junit.xml

      - name: Announce failure
        if: failure()
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: echo "🚨 Tests failed on $BRANCH"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/reports/junit.xml
          retention-days: 5

  package:
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.create-package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "version=0.1.$RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          tar -czf "dist/temperature-$VERSION.tar.gz" -C app temperature.py README.md

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist/temperature-${{ steps.ver.outputs.version }}.tar.gz
          if-no-files-found: error

  verify:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package

      - name: Extract and check package
        run: |
          mkdir extracted
          tar -xzf temperature-*.tar.gz -C extracted
          cd extracted
          python3 -c "from temperature import celsius_to_fahrenheit as c; assert c(100) == 212; print('Package OK')"

  pr-comment:
    needs: [package, verify]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh pr comment "$PR_NUMBER" --body "✅ CI passed. Package version $VERSION is ready."

  report:
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_RESULT: ${{ needs.test.result }}
      PACKAGE_RESULT: ${{ needs.package.result }}
      VERSION: ${{ needs.package.outputs.version || 'n/a' }}
      EVENT_NAME: ${{ github.event_name }}
      SHA: ${{ github.sha }}
      REPORT_TITLE: ${{ vars.REPORT_TITLE }}
      HAS_TOKEN: ${{ secrets.NOTIFY_TOKEN != '' }}
    steps:
      - name: Print results
        run: |
          echo "test:    $TEST_RESULT"
          echo "package: $PACKAGE_RESULT"

      - name: Write job summary
        run: |
          {
            echo "# $REPORT_TITLE"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| App name | $APP_NAME |"
            echo "| Version | $VERSION |"
            echo "| Commit | ${SHA::7} |"
            echo "| Event | $EVENT_NAME |"
            echo "| test | $TEST_RESULT |"
            echo "| package | $PACKAGE_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send notification
        if: env.HAS_TOKEN == 'true'
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
        run: |
          echo "Notification sent (token length: ${#NOTIFY_TOKEN})"
